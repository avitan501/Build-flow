name: Release main to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vercel-owner-release-main
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.email != 'sales@avdesignandbuilds.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create owner-authored release marker
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "Maor Avitan"
          git config user.email "sales@avdesignandbuilds.com"
          git commit --allow-empty -m "Release ${GITHUB_SHA} to Vercel"
          git push origin HEAD:main
