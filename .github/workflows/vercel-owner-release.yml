name: Deploy Avantia Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantia-build-production-release
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy main to build.avantiap.com
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the scoped Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          response=$(curl --fail --silent --show-error \
            --request POST \
            "$VERCEL_DEPLOY_HOOK_URL")
          state=$(jq -r '.job.state // "UNKNOWN"' <<< "$response")
          echo "Vercel accepted the manual production deployment. State: $state"
