<style>
*{box-sizing:border-box}body{margin:0;color:#203247;background:#f6f8fb;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:#276fbb}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #d3dce6;border-radius:8px;padding:10px 15px;background:white;color:#203247;min-height:44px}button.primary{background:#286fbb;color:white;border-color:#286fbb}button:disabled{opacity:.55;cursor:wait}a:focus-visible,button:focus-visible,input:focus,textarea:focus,select:focus{outline:2px solid #2878d1;outline-offset:2px}.wrap{max-width:1250px;margin:auto;padding:24px}.mast{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-weight:800;letter-spacing:2px;font-size:20px}.eyebrow{color:#3477b9;text-transform:uppercase;font-size:11px;letter-spacing:1.4px;font-weight:700}h1{font-size:32px;letter-spacing:-1px;margin:4px 0 8px}h2{font-size:21px;letter-spacing:-.4px;margin:0 0 10px}h3{font-size:16px;margin:8px 0}p{margin:8px 0}.muted,small{color:#6c7c8e}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:24px 0}.card{background:white;border:1px solid #dce3eb;border-radius:12px;padding:24px;margin:16px 0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.status{margin-left:auto;font-size:12px;color:#577086}.status.error{color:#9f3636}.status.unsaved{color:#866012}.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.record{text-align:left;white-space:normal;overflow-wrap:anywhere;padding:18px;background:white}.record strong,.record small{display:block}.record small{margin-top:6px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label.field{display:block;font-size:13px;font-weight:600}input[type=text],input[type=date],textarea,select{width:100%;display:block;padding:10px 12px;border:1px solid #cfd9e4;border-radius:7px;background:white;color:#203247;margin-top:6px}textarea{min-height:90px;resize:vertical;font-weight:400}input,select{min-height:44px}.field small{display:block;font-size:12px;font-weight:400;margin-top:4px}.steps{position:sticky;top:0;z-index:4;background:#f6f8fb;padding:12px 0;display:flex;gap:6px;overflow:auto}.steps button{min-width:130px;text-align:left;font-size:12px}.steps button small{display:block;font-size:10px}.steps button[aria-current=step]{background:#e6f0fd;border-color:#286fbb;color:#205e9d}.question{padding:18px 0;border-bottom:1px solid #edf0f5}.question:last-child{border-bottom:0}.question label{font-size:16px;font-weight:600;display:block}.question p{font-size:12px;color:#748296;margin:5px 0 10px}.question textarea{min-height:105px}.opening{background:#eaf2fc;padding:16px 20px;border-radius:8px;color:#3d628b;font-size:14px}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.check{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid #e0e7ef;border-radius:7px;font-size:13px;overflow-wrap:anywhere}.check input{min-height:20px;min-width:18px;margin-top:2px;accent-color:#2775c7}.check small{display:block;font-size:11px}.actions{display:flex;justify-content:space-between;gap:15px;margin-top:20px}.prompt{border-left:3px solid #bed3ee;padding:8px 13px;margin:12px 0;font-size:13px}.priority{padding:16px;background:#f5f8fc;border:1px solid #e2e9f0;border-radius:8px;margin:12px 0}.priority>label{margin:10px 0}.priority textarea{min-height:70px}.planfields{margin-top:24px;border-top:1px solid #e3e9ef;padding-top:24px}.planfields label{margin-bottom:16px}#plan-summary{min-height:210px}#print-area{display:none}.notice{font-size:13px;color:#76582f;padding:12px;background:#fff6e5;border-radius:8px}details{margin:16px 0}summary{cursor:pointer}progress{width:100%;height:5px;accent-color:#2775c7;margin-top:12px}.empty{padding:35px;text-align:center;border:1px dashed #c9d6e4;border-radius:10px;color:#6c7c8e}[hidden]{display:none!important}.preview-plan{white-space:pre-wrap;overflow-wrap:anywhere}.preview-section{margin:20px 0}.preview-section h3{color:#286fbb}.badge{font-size:11px;background:#eaf2fc;color:#2b659f;border-radius:12px;padding:4px 10px;white-space:nowrap}@media(max-width:650px){.wrap{padding:16px}.hero{align-items:flex-start;flex-direction:column}.mast{font-size:12px}.brand{font-size:17px}h1{font-size:28px}.card{padding:16px}.formgrid,.list,.checks{grid-template-columns:1fr}.steps button{min-width:116px}.toolbar .status{margin-left:0;width:100%}.check input{min-width:20px}.steps{top:0}.actions button{max-width:49%}}@media print{body{background:white;font-size:12px}.wrap{display:none}#print-area{display:block;padding:22px}#print-area h1{font-size:25px}#print-area .preview-section{break-inside:avoid}@page{size:letter;margin:.4in}}
</style>
<main class="wrap"><div class="mast"><span class="brand">AVANTIA</span><a href="/owner/service-planner">← Service &amp; fee planner</a></div>
<section id="home"><div class="hero"><div><div class="eyebrow">Listen first. Build the help around the job.</div><h1>Contractor discovery</h1><p class="muted">A 30-minute conversation that turns real purchasing problems into a focused help plan.</p></div><button id="new" class="primary">New contractor interview</button></div><div class="toolbar"><button id="refresh">Refresh saved interviews</button><span id="list-status" role="status"></span></div><div id="records" class="list"></div><button id="more" hidden>Load more</button></section>
<section id="editor" hidden><div class="toolbar"><button id="back">← All interviews</button><button id="save" class="primary">Save now</button><button id="download">Download notes</button><button id="preview">Preview help plan</button><span id="save-status" class="status" role="status">New interview · not saved</span></div><div class="card"><div class="eyebrow">Private interview notes</div><h1 id="interview-title">New contractor</h1><div class="formgrid" id="profile"></div><label class="field" style="max-width:280px;margin-top:16px">Interview status<select id="record-status"><option value="draft">Draft / in conversation</option><option value="reviewed">Reviewed with contractor</option><option value="pilot-agreed">Pilot scope agreed</option><option value="archived">Archived</option></select></label><small id="progress-label"></small><progress id="progress" max="15" value="0"></progress></div><div class="steps" id="steps" aria-label="Conversation sections"></div><div class="card"><div class="eyebrow" id="section-time"></div><h2 id="section-title"></h2><p id="opening" class="opening"></p><div id="questions"></div><div id="extras"></div><div class="actions"><button id="previous">← Previous</button><button id="next" class="primary">Next →</button></div></div></section>
<section id="plan-preview" hidden><div class="toolbar"><button id="return">← Back to interview</button><button id="print" class="primary">Print / save PDF</button></div><div class="card" id="preview-body"></div></section></main><div id="print-area"></div>
<script>
(()=>{'use strict';
const cfg=window.discoveryConfig, q=cfg.questions, api='/api/owner/service-planner/interviews';
const $=id=>document.getElementById(id);let record=null, step=0, dirty=false, serial=0, saving=false, timer=null, blocked=false, listing=false, nextOffset=null;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function serviceName(id){const i=q.serviceIds.indexOf(id);return cfg.offers?.[i]?.name||q.services[i].name}
function status(text,kind=''){ $('save-status').textContent=text;$('save-status').className='status '+kind;}
function updateProgress(){const count=q.sections.flatMap(s=>s.questions).filter(a=>(record.state.answers[a.id]||'').trim()).length;$('progress').value=count;$('progress-label').textContent=count+' of 15 main questions noted · follow-ups are optional';}
function changed(){dirty=true;serial++;status(blocked?'Save conflict · download your notes before reopening':'Unsaved changes','unsaved');updateProgress();clearTimeout(timer);if(record.state.profile.company.trim()&&!blocked)timer=setTimeout(save,1100)}
function field(label,value,set,{max=2500,small='',input=false,type='text'}={}){const wrap=el('label',undefined,'field');wrap.append(el('span',label));const control=el(input?'input':'textarea');if(input)control.type=type;control.value=value||'';control.maxLength=max;control.addEventListener('input',()=>{set(control.value);changed()});wrap.append(control);if(small)wrap.append(el('small',small));return wrap}
function blank(){return {id:crypto.randomUUID(),revision:0,updated_at:null,state:{type:'avantia-contractor-discovery-v1',profile:{company:'',contact:'',project:'',date:new Date().toLocaleDateString('en-CA')},answers:{},departments:[],priorities:[],services:[],plan:{summary:'',responsibility:'',exclusions:'',nextStep:'',successMeasure:'',fee:'',internalNotes:''},status:'draft'}}}
async function request(url,options){const r=await fetch(url,{...options,signal:AbortSignal.timeout(15000)});let data;try{data=await r.json()}catch{data={error:'Unexpected response. Keep your notes and retry.'}}if(!r.ok){const e=new Error(data.error||'Request failed');e.status=r.status;throw e}return data}
async function list(offset=0){if(listing)return;listing=true;$('list-status').textContent='Loading…';try{const data=await request(api+'?offset='+offset);if(offset===0)$('records').replaceChildren();for(const row of data.interviews){const b=el('button',undefined,'record');b.append(el('strong',row.company||'Unnamed contractor'),el('small',[row.contact,row.project].filter(Boolean).join(' · ')),el('small',(row.status||'draft')+' · '+new Date(row.updated_at).toLocaleDateString()));b.addEventListener('click',()=>open(row.id));$('records').append(b)}if(offset===0&&!data.interviews.length)$('records').append(el('div','No saved interviews yet. Start with one contractor and one recent order.','empty'));nextOffset=data.nextOffset;$('more').hidden=nextOffset===null;$('list-status').textContent='Saved to your private Avantia workspace.'}catch(e){$('list-status').textContent=e.message+' You can start an interview and download notes while saving is unavailable.'}finally{listing=false}}
function canLeave(){if(saving){status('Please wait for the current save to finish.','unsaved');return false}return !dirty||confirm('These notes are not saved. Download or save them before leaving. Leave anyway?')}
function showEditor(){step=0;dirty=false;serial=0;blocked=false;clearTimeout(timer);$('home').hidden=true;$('plan-preview').hidden=true;$('editor').hidden=false;renderProfile();renderSection();status(record.revision?'Saved interview · revision '+record.revision:'New interview · enter a company name to save');}
async function open(id){if(!canLeave())return;try{const loaded=await request(api+'?id='+encodeURIComponent(id));record=loaded;showEditor()}catch(e){$('list-status').textContent=e.message}}
function renderProfile(){$('interview-title').textContent=record.state.profile.company||'New contractor';$('profile').replaceChildren();for(const [key,label,max,type] of [['company','Company / contractor name',180,'text'],['contact','Contact person',180,'text'],['project','Project / location',300,'text'],['date','Conversation date',10,'date']])$('profile').append(field(label,record.state.profile[key],value=>{record.state.profile[key]=value;if(key==='company')$('interview-title').textContent=value||'New contractor'},{input:true,max,type}));$('record-status').value=record.state.status;updateProgress()}
function chooseDepartment(){const box=el('div');box.append(el('h3','Departments involved'),el('p','Choose the one or two packages to explore first. Other departments can be noted without discussing every row.','muted'));const grid=el('div',undefined,'checks');for(const d of cfg.departments){const label=el('label',undefined,'check'),input=el('input');input.type='checkbox';input.checked=record.state.departments.includes(d.id);input.addEventListener('change',()=>{record.state.departments=input.checked?[...record.state.departments,d.id]:record.state.departments.filter(x=>x!==d.id);changed()});const text=el('span',d.name);text.append(el('small',d.items));label.append(input,text);grid.append(label)}box.append(grid);return box}
function followups(){const box=el('details');box.append(el('summary','Optional follow-ups linked to our four services'));box.append(el('p','Use only after the contractor describes a real problem. Record relevant answers in the main question notes.','muted'));for(const s of q.services){const p=el('div',undefined,'prompt');p.append(el('strong',serviceName(s.id)),el('p',s.question));box.append(p)}return box}
function priorityFields(){const box=el('div');box.append(el('h3','The contractor’s two priorities'),el('p','Keep his words and a real example. Unknown frequency or impact is okay.','muted'));record.state.priorities.forEach((item,index)=>{const part=el('div',undefined,'priority');part.append(el('strong','Priority '+(index+1)));const label=el('label','Problem type','field'),select=el('select');select.setAttribute('aria-label','Priority '+(index+1)+' problem');for(const p of q.pains){const o=el('option',p.label);o.value=p.id;select.append(o)}select.value=item.pain;select.onchange=()=>{item.pain=select.value;changed();renderSection()};label.append(select);part.append(label,field('What happened / contractor’s words',item.evidence,v=>item.evidence=v),field('How often?',item.frequency,v=>item.frequency=v,{max:300,input:true}),field('Impact on GC time, crew or cost',item.impact,v=>item.impact=v,{max:500,small:'Record the period and source. Avoid counting the same interruption twice.'}));const remove=el('button','Remove priority');remove.onclick=()=>{record.state.priorities.splice(index,1);changed();renderSection()};part.append(remove);box.append(part)});if(record.state.priorities.length<2){const add=el('button','Add priority');add.onclick=()=>{record.state.priorities.push({pain:'other',evidence:'',frequency:'',impact:''});changed();renderSection()};box.append(add)}return box}
function serviceFields(){const box=el('div');box.append(el('h3','Match help to the problem'));const suggestions=new Set(record.state.priorities.flatMap(p=>q.pains.find(x=>x.id===p.pain)?.services||[]));box.append(el('p',suggestions.size?'Suggested to discuss: '+[...suggestions].map(serviceName).join(' · '):'Select services only when they fit an evidenced problem. Some problems may need a different solution.','muted'));const grid=el('div',undefined,'formgrid');for(const s of q.services){const label=el('label',undefined,'check'),input=el('input');input.type='checkbox';input.checked=record.state.services.includes(s.id);input.addEventListener('change',()=>{record.state.services=input.checked?[...record.state.services,s.id]:record.state.services.filter(x=>x!==s.id);changed()});const text=el('span',serviceName(s.id));text.append(el('small',s.when));label.append(input,text);grid.append(label)}box.append(grid,el('p','Suggestions are a discussion aid, not a diagnosis or a commitment to provide every service.','muted'));return box}
function draftPlan(){const s=record.state;const names=s.departments.map(id=>cfg.departments.find(d=>d.id===id)?.name).filter(Boolean);const lines=[];if(names.length)lines.push('Focus: '+names.join(', '));s.priorities.forEach((p,i)=>{lines.push('Priority '+(i+1)+': '+(q.pains.find(x=>x.id===p.pain)?.label||p.pain));if(p.evidence)lines.push('Example: '+p.evidence);if(p.frequency)lines.push('Frequency reported: '+p.frequency);if(p.impact)lines.push('Impact reported: '+p.impact)});if(s.services.length){lines.push('\nProposed Avantia help (for review):');for(const id of s.services)lines.push('• '+serviceName(id)+': '+q.services.find(x=>x.id===id).action)}if(!s.priorities.length||!s.services.length){status('Add a priority and select matching help before drafting.','unsaved');return}if(s.plan.summary&&!confirm('Replace the current summary with a draft from the selected priorities and services? Other plan fields will stay unchanged.'))return;s.plan.summary=lines.join('\n');changed();renderSection()}
function planFields(){const box=el('div',undefined,'planfields');box.append(el('h3','Help plan · review together'),el('p','Agree a small first engagement. Fill the responsibilities and success measure; do not promise a saving you have not measured.','muted'));const generate=el('button','Draft summary from priorities');generate.onclick=draftPlan;box.append(generate);for(const [key,label,max,hint] of [['summary','Proposed help summary',10000,'Uses only the priorities and services you selected. Edit before sharing.'],['responsibility','What the GC / trade remains responsible for',2500,'Approved quantities/specifications, purchase approval, site access, receiving and checking deliveries. Name the people.'],['exclusions','What is outside this first engagement',2500,'For example: site inspection, unapproved substitutions or homeowner design decisions.'],['successMeasure','How we will judge the first order',2500,'Use a reported baseline if available and a measurable target agreed with the contractor.'],['nextStep','Next action, owner and date',2500,'The next material list / plan / quote, who sends it, when and which order starts the trial.'],['fee','Fee / scope agreement',500,'Leave pending until agreed. This interview does not authorize a purchase.'],['internalNotes','Internal notes · never included in the help-plan printout',2500,'Service effort, open questions and commercial fit.']]){const f=field(label,record.state.plan[key],v=>record.state.plan[key]=v,{max,small:hint});if(key==='summary')f.querySelector('textarea').id='plan-summary';box.append(f)}return box}
function renderSection(){const s=q.sections[step];$('steps').replaceChildren();q.sections.forEach((s,i)=>{const b=el('button',(i+1)+'. '+s.title);b.append(el('small',s.time));if(i===step)b.setAttribute('aria-current','step');b.onclick=()=>{step=i;renderSection()};$('steps').append(b)});$('section-title').textContent=s.title;$('section-time').textContent=s.time+' · guide, not a timer';$('opening').textContent=q.opening;$('opening').hidden=step!==0;$('questions').replaceChildren();for(const question of s.questions){const div=el('div',undefined,'question');const f=field(question.text,record.state.answers[question.id],v=>record.state.answers[question.id]=v,{small:question.hint});div.append(f);$('questions').append(div)}$('extras').replaceChildren();if(step===2)$('extras').append(chooseDepartment(),followups());if(step===4)$('extras').append(priorityFields(),serviceFields());if(step===5)$('extras').append(planFields());$('previous').disabled=step===0;$('next').textContent=step===5?'Preview help plan':'Next →';}
async function save(){clearTimeout(timer);if(!record||!dirty||saving||blocked)return;if(!record.state.profile.company.trim()){status('Enter the company / contractor name before saving.','unsaved');return}const version=serial,payload=JSON.stringify(record);saving=true;status('Saving…');$('save').disabled=true;try{const data=await request(api,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:record.id,revision:record.revision,state:JSON.parse(payload).state})});record.revision=data.revision;record.updated_at=data.updated_at;if(serial===version){dirty=false;status('Saved to Avantia · revision '+data.revision)}else{status('Saving latest edits…');timer=setTimeout(save,50)}}catch(e){if(e.status===409)blocked=true;status(e.message||'Could not save. Download notes and retry.','error')}finally{saving=false;$('save').disabled=false}}
function preview(){const s=record.state;const box=$('preview-body');box.replaceChildren(el('div','AVANTIA · PROPOSED HELP PLAN','eyebrow'),el('h1',s.profile.company||'Contractor'),el('p',[s.profile.contact,s.profile.project,s.profile.date].filter(Boolean).join(' · '),'muted'));if(dirty||!record.revision)box.append(el('p','Draft contains unsaved notes. Save the interview before relying on the stored copy.','notice'));for(const [key,title] of [['summary','Where Avantia can help'],['responsibility','GC / trade responsibilities'],['exclusions','Outside this engagement'],['successMeasure','Success measure'],['nextStep','Next action'],['fee','Fee / scope agreement']]){const section=el('div',undefined,'preview-section');section.append(el('h3',title),el('div',s.plan[key]||'To agree','preview-plan'));box.append(section)}box.append(el('p','For discussion and approval. No purchase or guaranteed saving is authorized by this plan.','muted'));$('print-area').replaceChildren(...[...box.childNodes].map(n=>n.cloneNode(true)));$('editor').hidden=true;$('plan-preview').hidden=false;window.scrollTo(0,0)}
$('new').onclick=()=>{if(!canLeave())return;record=blank();showEditor()};$('refresh').onclick=()=>list();$('more').onclick=()=>list(nextOffset);$('save').onclick=save;$('record-status').onchange=()=>{record.state.status=$('record-status').value;changed()};$('previous').onclick=()=>{if(step>0){step--;renderSection()}};$('next').onclick=()=>{if(step===5)preview();else{step++;renderSection()}};$('back').onclick=()=>{if(!canLeave())return;clearTimeout(timer);record=null;dirty=false;$('editor').hidden=true;$('home').hidden=false;list()};$('download').onclick=()=>{const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='avantia-interview-'+record.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('preview').onclick=preview;$('return').onclick=()=>{$('plan-preview').hidden=true;$('editor').hidden=false};$('print').onclick=()=>window.print();window.addEventListener('beforeunload',event=>{if(dirty||saving){event.preventDefault();event.returnValue=''}});list();
})();
</script>
