<style>
html{color-scheme:light}body{margin:0;background:#fff;color:#173d33;font-family:Arial,sans-serif}
#avantia-checklist .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid #d8e5df}
#avantia-checklist button,#avantia-checklist .toolbar a{font:inherit;padding:10px 12px;border:1px solid #c6d8cf;border-radius:5px;background:#fff;color:#173d33;cursor:pointer;text-decoration:none}
#avantia-checklist .whatsapp{font-size:18px;font-weight:600;color:#145e43;display:block;text-underline-offset:4px}
#avantia-checklist #recovery,#avantia-checklist #versions{padding:16px;background:#fff3e5}
#avantia-checklist #versions button{margin:5px}
#avantia-checklist #customer table{min-width:800px;table-layout:fixed}
#avantia-checklist #customer th:nth-child(1){width:10%}
#avantia-checklist #customer th:nth-child(2){width:20%}
#avantia-checklist #customer th:nth-child(3){width:16%}
#avantia-checklist #customer th:nth-child(4){width:16%}
#avantia-checklist #customer th:nth-child(5){width:16%}
#avantia-checklist #customer th:nth-child(6){width:22%}
#avantia-checklist #customer{overflow:auto}
#avantia-checklist #customer td{white-space:pre-line;overflow-wrap:anywhere}
#avantia-checklist #customer p{padding:0 16px}
#avantia-checklist.preview .sheet,#avantia-checklist.preview .legend{display:none}
@page{size:letter landscape;margin:0.25in}
@media print{
  #avantia-checklist .toolbar,#avantia-checklist .sheet,#avantia-checklist .legend,#avantia-checklist #av-save,#avantia-checklist #versions,#avantia-checklist #recovery{display:none!important}
  #avantia-checklist #customer{display:block!important;overflow:visible}
  #avantia-checklist #customer table{min-width:0;width:100%;font-size:8px;line-height:1.1}
  #avantia-checklist #customer th{font-size:8px;padding:3px}
  #avantia-checklist #customer td{padding:2px 3px}
  #avantia-checklist header{padding:4px}#avantia-checklist h2{font-size:16px;margin:0}
  #avantia-checklist .offer{padding:4px;font-size:9px}#avantia-checklist .whatsapp{font-size:12px}
  #avantia-checklist .offer p{margin:3px 0}#avantia-checklist .benefits{gap:4px 12px}
  #avantia-checklist #customer p{font-size:8px;margin:4px}
  #avantia-checklist tr{break-inside:avoid}
}
@media screen{
html,body{background:#fff;color:#202329;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#avantia-checklist{--av-bg:#fff;--av-fg:#202329;--av-line:#e3e5eb;--av-soft:#f6f7fa;--av-pain:#f6f7fa;--av-solve:#f6f7fa;font-family:inherit;font-size:14px;line-height:1.5;max-width:1500px;padding:0 28px 40px;margin:auto}
#avantia-checklist header{background:#fff;padding:30px 0 22px;border-bottom:1px solid #eceef2;align-items:flex-start}
#avantia-checklist .brand{display:block;letter-spacing:-.7px;font-size:25px;font-weight:750;color:#14171c}
#avantia-checklist h2{font-size:22px;letter-spacing:-.5px;font-weight:650;margin:5px 0}
#avantia-checklist header h2{font-size:16px;letter-spacing:0;color:#757b84;font-weight:400;margin-top:7px}
#avantia-checklist #av-save{color:#646c79;padding:7px 12px;border:1px solid #e3e5eb;border-radius:20px;background:#fafbfc;font-size:11px}
#avantia-checklist .offer{padding:22px 0;background:#fff}
#avantia-checklist .whatsapp{font-size:18px;font-weight:600;color:#2677c9;text-decoration:none;letter-spacing:-.25px}
#avantia-checklist .whatsapp:hover{text-decoration:underline}
#avantia-checklist .offer p{color:#797e87;font-size:15px;margin:5px 0 16px}
#avantia-checklist .benefits{gap:8px 20px;color:#606773;font-size:12px}
#avantia-checklist .service-planning{padding:20px;background:#f7f8fb;border:1px solid #e3e5eb;border-radius:14px}
#avantia-checklist .service-planning h2{font-size:18px}
#avantia-checklist .service-planning>p{color:#737986;font-size:13px;margin:5px 0 18px}
#avantia-checklist .service-editor{gap:16px}
#avantia-checklist .service-editor article{padding:0;border:0;border-radius:0;background:transparent}
#avantia-checklist .service-editor label>span{font-size:11px;letter-spacing:.25px;color:#747b87;font-weight:500}
#avantia-checklist .service-editor textarea{border:1px solid #dde1e8;border-radius:7px;padding:9px;background:#fff;font-size:13px}
#avantia-checklist .service-editor label:first-child textarea{font-weight:600}
#avantia-checklist .service-editor label:nth-child(2) textarea{color:#2677c9;font-weight:600}
#avantia-checklist .service-editor article:last-child label:nth-child(2) textarea{color:#202329}
#avantia-checklist .fees{font-size:12px;color:#747b87;margin-top:6px}
#avantia-checklist .toolbar{padding:20px 0 8px;border:0;gap:8px}
#avantia-checklist button,#avantia-checklist .toolbar a{border:1px solid #e1e4ea;border-radius:8px;padding:9px 12px;color:#535b67;font-size:12px;background:#fff}
#avantia-checklist button:hover,#avantia-checklist .toolbar a:hover{background:#f5f7fa;color:#202329}
#avantia-checklist #preview{background:#2b7ccc;border-color:#2b7ccc;color:#fff;font-weight:600}
#avantia-checklist .legend{padding:13px 0;color:#7a808a;font-size:12px}
#avantia-checklist .sheet{border:1px solid #cdd1d9;border-radius:12px;max-height:76dvh}
#avantia-checklist .sheet thead .service-groups th{background:#f1f3f7;color:#818894;font-size:10px;font-weight:600;letter-spacing:.6px;padding:9px 12px}
#avantia-checklist .column-headings th{background:#f6f7fa;color:#676e79;font-size:12px;line-height:1.4;font-weight:500;padding:13px 12px;border-bottom:1px solid #e8eaf0}
#avantia-checklist .column-headings th small{color:#8b9099;font-size:10px;line-height:1.4}
#avantia-checklist .column-headings th:nth-child(7),#avantia-checklist .column-headings th:nth-child(8){background:#f6f7fa}
#avantia-checklist td{padding:12px 10px;border-bottom:0;font-size:13px;vertical-align:middle}
#avantia-checklist #av-body tr[data-row-id]:nth-child(odd)>td,#avantia-checklist #customer tbody tr:nth-child(odd)>td{background:#fff}
#avantia-checklist #av-body tr[data-row-id]:nth-child(even)>td,#avantia-checklist #customer tbody tr:nth-child(even)>td{background:#f6f7fa}
#avantia-checklist #av-body tr[data-row-id]:hover>td{background:#eef4fb}
#avantia-checklist .support-start{border-left:1px solid #e1e5ec}
#avantia-checklist tbody th{background:#edf0f5;color:#7b8390;padding:12px;font-size:11px;font-weight:500}
#avantia-checklist textarea{border-radius:6px;min-height:44px;padding:5px;line-height:1.5}
#avantia-checklist textarea:focus{outline:2px solid #2b7ccc;background:#fff}
#avantia-checklist td:first-child textarea{font-weight:600;letter-spacing:-.15px;color:#22262d}
#avantia-checklist .reference{font-size:10px;color:#9298a2;margin-top:3px}
#avantia-checklist summary{font-size:12px;font-weight:500;color:#6c7481}
#avantia-checklist .picked div{font-size:12px;color:#606976}
#avantia-checklist .checklabel{position:relative;min-height:44px;cursor:pointer}
#avantia-checklist .checklabel input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1}
#avantia-checklist .service-mark{display:inline-flex;align-items:center;justify-content:center;width:6px;height:6px;border-radius:50%;background:#dfe2e8;color:#fff;font-size:12px;font-weight:700}
#avantia-checklist .checklabel input:checked+.service-mark{width:38px;height:24px;border-radius:6px;background:#2c7dcc}
#avantia-checklist .checklabel input:checked+.service-mark:after{content:'✓'}
#avantia-checklist .checklabel input:indeterminate+.service-mark{width:24px;height:24px;border-radius:6px;background:#e9edf3;color:#747e8c}
#avantia-checklist .checklabel input:indeterminate+.service-mark:after{content:'?'}
#avantia-checklist .support-start .checklabel input:checked+.service-mark{background:#23272d}
#avantia-checklist .checklabel:has(input:focus-visible){outline:2px solid #2c7dcc;outline-offset:2px;border-radius:6px}
#avantia-checklist .option input{accent-color:#2c7dcc}
#avantia-checklist .service-offer{padding:20px 0;gap:16px}
#avantia-checklist .service-offer article{border:0;border-left:2px solid #e6ebf2;border-radius:0;padding:4px 15px}
#avantia-checklist .service-offer h3{font-size:15px;letter-spacing:-.2px;font-weight:600}
#avantia-checklist .service-offer strong{font-size:18px;color:#287acb}
#avantia-checklist .service-offer article:last-child strong{color:#23272d}
#avantia-checklist .service-offer p{color:#737b87;font-size:13px}
#avantia-checklist #customer{border:1px solid #cdd1d9;border-radius:12px;margin-top:12px}
#avantia-checklist #customer th{background:#f6f7fa;color:#727b88;font-weight:500;padding:14px 12px;font-size:12px}
#avantia-checklist #customer td{font-size:13px;padding:14px 12px;color:#414955}
#avantia-checklist #customer td:first-child{font-weight:600;color:#202329}
#avantia-checklist #customer>p{color:#8a919b;font-size:11px}
@media(max-width:650px){
#avantia-checklist{padding:0 16px 24px}
#avantia-checklist header{padding:22px 0 18px;gap:12px}
#avantia-checklist .brand{font-size:24px}
#avantia-checklist .offer{padding:18px 0}
#avantia-checklist .whatsapp{font-size:16px}
#avantia-checklist .benefits{gap:9px;font-size:11px}
#avantia-checklist .service-planning{padding:16px}
#avantia-checklist .service-editor{gap:16px}
#avantia-checklist .service-editor article+article{border-top:1px solid #e1e4eb;padding-top:16px}
#avantia-checklist .service-editor textarea{font-size:16px}
#avantia-checklist .toolbar{gap:7px}
#avantia-checklist .toolbar button,#avantia-checklist .toolbar a{min-height:44px}
#avantia-checklist .sheet td:first-child{box-shadow:1px 0 0 #e5e8ee}
#avantia-checklist .service-offer{grid-template-columns:1fr;gap:20px}
}}
@media print{
#avantia-checklist{--av-fg:#202329;--av-soft:#f5f6f9;--av-pain:#f5f6f9;--av-solve:#f5f6f9;color:#202329}
#avantia-checklist .service-offer strong{color:#287acb}
#avantia-checklist #customer tbody tr:nth-child(even)>td{background:#f5f6f9}
#avantia-checklist .support-start{border-left:1px solid #e1e4eb}
}

</style>
<script>
(()=>{
const root=document.getElementById('avantia-checklist'),recovery=root.querySelector('#recovery'),versions=root.querySelector('#versions');
const endpoint='/api/owner/service-planner';let revision=window.plannerInitial.revision,blocked=false,inFlight=false;
function backup(){const blob=new Blob([JSON.stringify(window.plannerSnapshot(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='avantia-service-planner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
root.querySelector('#download').onclick=backup;
function failure(message,conflict){recovery.hidden=false;recovery.replaceChildren();const p=document.createElement('p');p.textContent=message;recovery.append(p);const download=document.createElement('button');download.textContent='Download my edits';download.onclick=backup;recovery.append(download);const next=document.createElement('button');next.textContent=conflict?'Reload saved version':'Retry saving';next.onclick=()=>{if(conflict){if(confirm('Download your edits first if you want to keep them. Reload the saved version?')){window.plannerDirty=false;location.reload();}}else{blocked=false;window.plannerRestore(window.plannerSnapshot());}};recovery.append(next);}
window.openai={setWidgetState:async snapshot=>{
 if(blocked)throw new Error('Save paused');
 inFlight=true;
 try{
 const response=await fetch(endpoint,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,state:snapshot.modelContent})});
 if(!response.ok){blocked=true;failure(response.status===409?'Another tab saved a newer version. Your edits are still here; download them before reloading.':'Your edits are not saved yet. Keep this page open and retry.',response.status===409);throw new Error('Save failed');}
 const saved=await response.json();revision=saved.revision;recovery.hidden=true;
 }catch(error){if(!blocked){blocked=true;failure('Could not confirm the save. Keep your edits here and retry; a newer saved version will never be overwritten automatically.',false);}throw error;}finally{inFlight=false;}
}};
window.addEventListener('beforeunload',e=>{if(window.plannerDirty||inFlight){e.preventDefault();e.returnValue='';}});
const painNames={reorders:'Frequent reorders',missing:'Missing materials / documents',pricing:'Overpaying / unclear pricing',calls:'Too many supplier calls',chasing:'Chasing bookings / deliveries',stores:'Shopping at several stores',quantities:'Unclear quantities',scope:'Unclear subcontractor inclusions',approvals:'Waiting for selections / approvals'};
function customerPreview(){const serviceNames=window.plannerServiceNames();const target=root.querySelector('#customer');target.replaceChildren();const table=document.createElement('table'),head=document.createElement('thead'),hr=document.createElement('tr');['Department','Materials','Main services','Support','GC’s pain','What this takes off your plate'].forEach(name=>{const th=document.createElement('th');th.textContent=name;if(name==='Support')th.className='support-start';hr.append(th);});head.append(hr);table.append(head);const body=document.createElement('tbody');window.plannerRows(window.plannerSnapshot().rows).forEach(r=>{if(r.id===3){const section=document.createElement('tr'),heading=document.createElement('th');heading.colSpan=6;heading.textContent='Additional services / packages';section.append(heading);body.append(section);}const tr=document.createElement('tr');const labels=(key,names)=>r[key+'Ids'].filter(id=>key!=='solution'||!['contact','reorders','compare'].includes(id)).map(id=>id==='other'?r[key+'Other']:names[id]).filter(Boolean).map(v=>'✓ '+v).join('\n');[r.department,r.items,...[0,3].map(start=>window.plannerServices(r).slice(start,start+3).map((v,i)=>v===true?'✓ '+serviceNames[start+i]:null).filter(Boolean).join('\n')),labels('pain',painNames),window.plannerOutcome(r)].forEach((value,index)=>{const td=document.createElement('td');td.textContent=value;if(index===3)td.className='support-start';tr.append(td);});body.append(tr);});table.append(body);target.append(table);const foot=document.createElement('p');foot.textContent='Avantia · WhatsApp (516) 990-1990 · avantiabuild.com';target.append(foot);}
root.querySelector('#preview').onclick=()=>{const preview=!root.classList.contains('preview');customerPreview();root.classList.toggle('preview',preview);root.querySelector('#customer').hidden=!preview;root.querySelector('#preview').textContent=preview?'Back to editing':'Customer preview';};
root.querySelector('#print').onclick=()=>{customerPreview();window.print();};window.addEventListener('beforeprint',customerPreview);
root.querySelector('#history').onclick=async()=>{
 if(!versions.hidden){versions.hidden=true;return;}versions.hidden=false;versions.textContent='Loading saved versions…';
 try{const response=await fetch(endpoint,{cache:'no-store'});if(!response.ok)throw new Error();const saved=await response.json();versions.replaceChildren();const title=document.createElement('p');title.textContent='Last 20 saved versions. Restoring creates a new version.';versions.append(title);if(!saved.history.length)versions.append(document.createTextNode('No earlier saved versions yet.'));
 saved.history.forEach(v=>{const button=document.createElement('button');button.textContent='Restore version '+v.revision+' · '+new Date(v.savedAt).toLocaleString();button.onclick=()=>{if(blocked||inFlight||window.plannerDirty){alert('Save or download your current edits before restoring a version.');return;}if(revision!==saved.revision){alert('The version list changed. Close it and open it again.');return;}if(confirm('Restore this version? Your current saved version remains in history.')){window.plannerRestore(v.state);versions.hidden=true;}};versions.append(button);});
 }catch{versions.textContent='Could not load saved versions. Close this panel and try again.';}
};
})();
</script>
